<div style="max-width:600px; margin:auto;">

  <label style="font-size:10px; margin-left:16px; margin-bottom:0px;"><strong>Email Address*</strong></label>
  <input type="text" name="contact_email" style="font-size:14px; padding:8px; background:#ffffff; margin-left:16px; width:85%;" placeholder="happy@exampleemail.com" required/>

  <label style="font-size:10px; margin-left:16px; margin-bottom:0px;"><strong>Phone Number*</strong></label>
  <input type="text" name="contact_phone" style="font-size:14px; padding:8px; background:#ffffff; margin-left:16px; margin-bottom:16px; width:85%;" placeholder="example: (772) 713-5071" required/>


  <input type="hidden" name="_next" value="/inquiry_confirmation" />

  <input type="submit" class="inquiry_button" value="Send!" style="  border-radius:10px;
    border: none;
    color: white;
    background:#28abe2;

    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 10px;"/>
